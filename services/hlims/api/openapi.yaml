      tags: [Machines]
      operationId: listMachineInstances
      responses: {"200": {description: Service instances, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/MachineInstance"}}}}}}}, default: {$ref: "#/components/responses/Error"}}
  /resolve/{service}/{instance}:
    parameters: [{$ref: "#/components/parameters/ServiceSlug"}, {$ref: "#/components/parameters/InstanceSlug"}, {$ref: "#/components/parameters/Host"}, {$ref: "#/components/parameters/Via"}]
    get:
      tags: [Resolver]
      operationId: resolveInstance
      responses: {"200": {description: Resolved destination, content: {application/json: {schema: {$ref: "#/components/schemas/ResolvedDestination"}}}}, default: {$ref: "#/components/responses/Error"}}
  /resolve/port/{machine}/{port}:
    parameters:
      - {$ref: "#/components/parameters/MachineSlug"}
      - {name: port, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 65535}}
      - {$ref: "#/components/parameters/Via"}
      - {name: scheme, in: query, schema: {$ref: "#/components/schemas/Scheme"}}
    get:
      tags: [Resolver]
      operationId: resolveMachinePort
      responses: {"200": {description: Resolved destination, content: {application/json: {schema: {$ref: "#/components/schemas/ResolvedDestination"}}}}, default: {$ref: "#/components/responses/Error"}}
components:
  parameters:
    PublicId: {name: publicId, in: path, required: true, schema: {$ref: "#/components/schemas/PublicId"}}
    MachineSlug: {name: machine, in: path, required: true, schema: {$ref: "#/components/schemas/Slug"}}
    ServiceSlug: {name: service, in: path, required: true, schema: {$ref: "#/components/schemas/Slug"}}
    InstanceSlug: {name: instance, in: path, required: true, schema: {$ref: "#/components/schemas/Slug"}}
    Host: {name: host, in: query, description: Machine slug or managed when more than one instance has the same service and instance slug, schema: {$ref: "#/components/schemas/Slug"}}
    Via: {name: via, in: query, schema: {$ref: "#/components/schemas/Via"}}
  requestBodies:
    MachineProviderWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MachineProviderWrite"}}}}
    AreaWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AreaWrite"}}}}
    ManufacturerWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ManufacturerWrite"}}}}
    ProductWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ProductWrite"}}}}
    AssetWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AssetWrite"}}}}
    PurchaseWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PurchaseWrite"}}}}
    MachineWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MachineWrite"}}}}
    MachineUserWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MachineUserWrite"}}}}
    NetworkWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/NetworkWrite"}}}}
    AddressWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AddressWrite"}}}}
    DNSZoneWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DNSZoneWrite"}}}}
    DNSRecordWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DNSRecordWrite"}}}}
    IngressRouteWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IngressRouteWrite"}}}}
    ServiceWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ServiceWrite"}}}}
    InstanceWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InstanceWrite"}}}}
    InstanceEndpointWrite: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InstanceEndpointWrite"}}}}
  responses:
    Error: {description: Error response, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  schemas:
    PublicId: {type: string, pattern: "^[a-z0-9]{12}$"}
    Slug: {type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"}
    Via: {type: string, enum: [lan, tailnet, cloud_vpc, public, loopback, managed]}
    InstanceHostingKind: {type: string, enum: [machine, managed]}
    Scheme: {type: string, enum: [http, https]}
    EndpointHostType: {type: string, enum: [auto, dns, ip]}
    DNSRecordKind: {type: string, enum: [A, AAAA]}
    IngressRouteKind: {type: string, enum: [proxy, static, redirect]}
    MachineKind: {type: string, enum: [bare_metal, virtual_machine]}
    NetworkKind: {type: string, enum: [lan, tailnet, cloud_vpc, public, loopback]}
    ProductKind: {type: string, enum: [system, processor, memory, drive, rack, router, switch, access_point, network_adapter]}
    ProductLinkKind: {type: string, enum: [manufacturer, retailer, manual, datasheet, support]}
    AssetLinkKind: {type: string, enum: [receipt, warranty, management, other]}
    PurchaseLinkKind: {type: string, enum: [receipt, listing, other]}
    AssetPlacementType: {type: string, enum: [area, asset, unplaced]}
    CpuAllocation: {type: string, enum: [shared, dedicated]}
    StorageMediaKind: {type: string, enum: [hdd, ssd]}
    StorageInterfaceKind: {type: string, enum: [sata, sas, nvme, usb, scsi, virtio, virtual]}
    Topology:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          items: {$ref: "#/components/schemas/TopologyProvider"}
    TopologyProvider:
      type: object
      additionalProperties: false
      required: [publicId, name, slug, hasLogo, areas]
      properties:
        publicId: {$ref: "#/components/schemas/PublicId"}
        name: {type: string}
        slug: {$ref: "#/components/schemas/Slug"}
        hasLogo: {type: boolean}
        areas:
          type: array
          items: {$ref: "#/components/schemas/TopologyArea"}
    TopologyArea:
      type: object
      additionalProperties: false
      required: [publicId, name, slug, machines]
      properties:
        publicId: {$ref: "#/components/schemas/PublicId"}
        name: {type: string}
        slug: {$ref: "#/components/schemas/Slug"}
        machines:
          type: array
          description: Root machines in the area. Descendants are recursively nested in children.
          items: {$ref: "#/components/schemas/TopologyMachine"}
    TopologyMachine:
      type: object
      additionalProperties: false
      required: [publicId, name, slug, kind, isFavorite, users, addresses, hardware, children, services]
      properties:
        publicId: {$ref: "#/components/schemas/PublicId"}
        name: {type: string}
        slug: {$ref: "#/components/schemas/Slug"}
        kind: {$ref: "#/components/schemas/MachineKind"}
        isFavorite: {type: boolean}
        hostname: {type: string, nullable: true}
        operatingSystem: {type: string, nullable: true}
        operatingSystemVersion: {type: string, nullable: true}
        kernel: {type: string, nullable: true}
        architecture: {type: string, nullable: true}
        cpuCount: {type: integer, minimum: 1, nullable: true}
        cpuThreadCount: {type: integer, minimum: 1, nullable: true, description: Logical hardware threads for a physical Machine; cpuCount is cores on physical Machines or vCPUs on virtual Machines.}
        cpuAllocation:
          nullable: true
          allOf: [{$ref: "#/components/schemas/CpuAllocation"}]
        cpuVendor: {type: string, nullable: true}
        memoryBytes: {type: integer, format: int64, minimum: 1, nullable: true}
        storageBytes: {type: integer, format: int64, minimum: 1, nullable: true}
        storageMediaKind:
          nullable: true
          allOf: [{$ref: "#/components/schemas/StorageMediaKind"}]
        storageInterfaceKind:
          nullable: true
          allOf: [{$ref: "#/components/schemas/StorageInterfaceKind"}]
        virtualizationPlatform: {type: string, nullable: true}
        users:
          type: array
          items: {$ref: "#/components/schemas/TopologyMachineUser"}
        addresses:
          type: array
          items: {$ref: "#/components/schemas/TopologyMachineAddress"}
        hardware:
          type: array
          description: Installed processor and memory Assets of the backing physical system.
          items: {$ref: "#/components/schemas/TopologyMachineHardware"}
        children:
          type: array
          items: {$ref: "#/components/schemas/TopologyMachine"}
        services:
          type: array
          items: {$ref: "#/components/schemas/TopologyService"}
    TopologyMachineUser:
      type: object
      additionalProperties: false
      required: [publicId, username, isPreferred]
      properties:
        publicId: {$ref: "#/components/schemas/PublicId"}
        username: {$ref: "#/components/schemas/MachineUsername"}
        isPreferred: {type: boolean}
        notes: {type: string, nullable: true}
    TopologyMachineAddress:
      type: object
      additionalProperties: false
      required: [publicId, networkPublicId, networkKind, address, isPrimary]
      properties:
        publicId: {$ref: "#/components/schemas/PublicId"}
        networkPublicId: {$ref: "#/components/schemas/PublicId"}
        networkKind: {$ref: "#/components/schemas/NetworkKind"}
        name: {type: string, nullable: true}
        address: {type: string}
        dnsName: {type: string, nullable: true}
        interfaceName: {type: string, nullable: true}
        isPrimary: {type: boolean}
    TopologyMachineHardware:
      type: object
      additionalProperties: false
      required: [assetPublicId, productPublicId, kind, name]
      properties:
        assetPublicId: {$ref: "#/components/schemas/PublicId"}
        productPublicId: {$ref: "#/components/schemas/PublicId"}
        kind: {$ref: "#/components/schemas/ProductKind"}
        name: {type: string}
        generation: {type: string, nullable: true}
        codename: {type: string, nullable: true}
        memoryType: {type: string, nullable: true}
    TopologyService:
      type: object
      additionalProperties: false
      required: [publicId, name, slug, hasLogo, instances]
      properties:
        publicId: {$ref: "#/components/schemas/PublicId"}
        name: {type: string}
        slug: {$ref: "#/components/schemas/Slug"}
        description: {type: string, nullable: true}
        hasLogo: {type: boolean}
        instances:
          type: array
          items: {$ref: "#/components/schemas/TopologyInstance"}
    TopologyInstance:
      type: object
      additionalProperties: false
      required: [publicId, name, slug, availableVia, endpoints]
      properties:
        publicId: {$ref: "#/components/schemas/PublicId"}
        name: {type: string}
        slug: {$ref: "#/components/schemas/Slug"}
        port: {type: integer, minimum: 1, maximum: 65535, nullable: true}
        resolverPath: {type: string, nullable: true, description: Canonical root-relative redirect path, present only when an endpoint is recorded.}
        endpoints:
          type: array
          description: Every recorded client-facing route for this instance.
          items: {$ref: "#/components/schemas/TopologyInstanceEndpoint"}
        availableVia:
          type: array
          description: Network routes that can be selected by adding the via query parameter to resolverPath.
          items: {$ref: "#/components/schemas/Via"}
    TopologyInstanceEndpoint:
      type: object
      additionalProperties: false
      required: [publicId, name, networkKind, address, scheme, port, hostType, url, isPreferred]
      properties:
        publicId: {$ref: "#/components/schemas/PublicId"}
        name: {type: string}
        networkKind: {$ref: "#/components/schemas/NetworkKind"}
        address: {type: string, description: IP address of the device on this network.}
        dnsName: {type: string, nullable: true}
        dnsRecordPublicId:
          nullable: true
          allOf: [{$ref: "#/components/schemas/PublicId"}]
        scheme: {$ref: "#/components/schemas/Scheme"}
        port: {type: integer, minimum: 1, maximum: 65535}
        hostType: {$ref: "#/components/schemas/EndpointHostType"}
        url: {type: string, format: uri, description: Configured URL, using the DNS name or IP as selected by hostType.}
        isPreferred: {type: boolean}
        ingress:
          nullable: true
          allOf: [{$ref: "#/components/schemas/IngressRoute"}]
    MachineProviderWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties: {name: {type: string}, slug: {$ref: "#/components/schemas/Slug"}}
    MachineProvider:
      allOf: [{$ref: "#/components/schemas/MachineProviderWrite"}, {type: object, required: [publicId, slug, hasLogo], properties: {publicId: {type: string}, slug: {$ref: "#/components/schemas/Slug"}, hasLogo: {type: boolean}}}]
    AreaWrite:
      type: object
      additionalProperties: false
      required: [machineProviderPublicId, name]
      properties: {machineProviderPublicId: {type: string}, name: {type: string}, slug: {$ref: "#/components/schemas/Slug"}, providerCode: {type: string, nullable: true}, notes: {type: string, nullable: true}}
    Area:
      allOf: [{$ref: "#/components/schemas/AreaWrite"}, {type: object, required: [publicId, slug], properties: {publicId: {type: string}, slug: {$ref: "#/components/schemas/Slug"}}}]
    ManufacturerWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties: {name: {type: string}, slug: {$ref: "#/components/schemas/Slug"}}
    Manufacturer:
      allOf: [{$ref: "#/components/schemas/ManufacturerWrite"}, {type: object, required: [publicId, slug], properties: {publicId: {type: string}, slug: {$ref: "#/components/schemas/Slug"}}}]
    ProcessorSpec:
      type: object
      additionalProperties: false
      required: [coreCount, threadCount]
      properties:
        coreCount: {type: integer, minimum: 1}
        threadCount: {type: integer, minimum: 1, description: Must be greater than or equal to coreCount.}
        baseClockMhz: {type: integer, minimum: 1, nullable: true}
        generation: {type: string, nullable: true, description: Vendor product generation, such as 4th Gen Core or Ryzen AI 300.}
        codename: {type: string, nullable: true, description: Processor family codename, such as Haswell or Krackan Point.}
        virtualization: {type: string, nullable: true}
    MemorySpec:
      type: object
      additionalProperties: false
      required: [capacityBytes, memoryType]
      properties:
        capacityBytes: {type: integer, format: int64, minimum: 1}
        memoryType: {type: string}
        formFactor: {type: string, nullable: true}
        speedMts: {type: integer, minimum: 1, nullable: true}
    DriveSpec:
      type: object
      additionalProperties: false
      required: [capacityBytes, mediaKind]
      properties:
        capacityBytes: {type: integer, format: int64, minimum: 1}
        mediaKind: {$ref: "#/components/schemas/StorageMediaKind"}
        interfaceKind:
          nullable: true
          allOf: [{$ref: "#/components/schemas/StorageInterfaceKind"}]
    RackSpec:
      type: object
      additionalProperties: false
      required: [rackUnits, mountingStandard]
      properties:
        rackUnits: {type: integer, minimum: 1}
        mountingStandard: {type: string, minLength: 1, example: 10-inch}
    PortProfile:
      type: object
      additionalProperties: false
      required: [portCount, connector, speedMbps]
      properties:
        name: {type: string, nullable: true}
        portCount: {type: integer, minimum: 1}
        connector: {type: string, minLength: 1, example: RJ45}
        speedMbps: {type: integer, minimum: 1}
    WiFiBandSpec:
      type: object
      additionalProperties: false
      required: [bandGHz, maxLinkMbps]
      properties:
        bandGHz: {type: string, enum: ["2.4", "5", "6"]}
        maxLinkMbps: {type: integer, minimum: 1, description: Manufacturer-advertised link rate, not measured throughput.}
    WiFiSpec:
      type: object
      additionalProperties: false
      required: [generation, ieeeStandard, bands]
      properties:
        generation: {type: integer, minimum: 1, description: Marketed Wi-Fi generation such as 7.}
        ieeeStandard: {type: string, description: Primary standard such as 802.11be.}
        class: {type: string, nullable: true, description: Manufacturer marketing class such as BE11000.}
        maxChannelWidthMHz: {type: integer, minimum: 1, nullable: true}
        bands:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/WiFiBandSpec"}
    ProductLink:
      type: object
      additionalProperties: false
      required: [kind, url]
      properties:
        kind: {$ref: "#/components/schemas/ProductLinkKind"}
        label: {type: string, nullable: true}
        url:
          type: string
          format: uri
          pattern: "^https?://"
          description: Absolute HTTP or HTTPS URL without credentials or a fragment.
    AssetLink:
      type: object
      additionalProperties: false
      required: [kind, url]
      properties:
        kind: {$ref: "#/components/schemas/AssetLinkKind"}
        label: {type: string, nullable: true}
        url:
          type: string
          format: uri
          pattern: "^https?://"
          description: Absolute HTTP or HTTPS URL without credentials or a fragment.
    ProductWrite:
      type: object
      additionalProperties: false
      description: The product kind determines which specifications are allowed. Routers and access points may have Wi-Fi specifications alongside port profiles; other kinds use their dedicated spec where applicable.
      required: [manufacturerPublicId, kind, name]
      properties:
        manufacturerPublicId: {$ref: "#/components/schemas/PublicId"}
        kind: {$ref: "#/components/schemas/ProductKind"}
        name: {type: string}
        partNumber: {type: string, nullable: true}
        notes: {type: string, nullable: true}
        processorSpec: {$ref: "#/components/schemas/ProcessorSpec"}
        memorySpec: {$ref: "#/components/schemas/MemorySpec"}
        driveSpec: {$ref: "#/components/schemas/DriveSpec"}
        rackSpec: {$ref: "#/components/schemas/RackSpec"}
        wifiSpec: {$ref: "#/components/schemas/WiFiSpec"}
        portProfiles:
          type: array
          items: {$ref: "#/components/schemas/PortProfile"}
        links:
          type: array
          items: {$ref: "#/components/schemas/ProductLink"}
    Product:
      allOf:
        - {$ref: "#/components/schemas/ProductWrite"}
        - type: object
          required: [publicId]
          properties:
            publicId: {$ref: "#/components/schemas/PublicId"}
    AssetPlacement:
      type: object
      additionalProperties: false
      description: Area placements require areaPublicId, asset placements require parentAssetPublicId, and unplaced placements require neither.
      required: [type]
      properties:
        type: {$ref: "#/components/schemas/AssetPlacementType"}
        areaPublicId:
          nullable: true
          allOf: [{$ref: "#/components/schemas/PublicId"}]
        parentAssetPublicId:
          nullable: true
          allOf: [{$ref: "#/components/schemas/PublicId"}]
        slot:
          type: string
          nullable: true
          description: Descriptive slot within the parent Asset, such as PCIe x16.
    PurchaseLink:
      type: object
      additionalProperties: false
      required: [kind, url]
      properties:
        kind: {$ref: "#/components/schemas/PurchaseLinkKind"}
        label: {type: string, nullable: true}
        url:
          type: string
          format: uri
          pattern: "^https?://"
          description: Absolute HTTP or HTTPS URL without credentials or a fragment.
    PurchaseLine:
      type: object
      additionalProperties: false
      required: [description, quantity]
      description: An owned item selected from an order; other retailer lines can be omitted.
      properties:
        productPublicId:
          nullable: true
          allOf: [{$ref: "#/components/schemas/PublicId"}]
        description: {type: string, minLength: 1}
        quantity: {type: integer, minimum: 1}
        subtotalCents: {type: integer, format: int64, minimum: 0, nullable: true, description: Selected line subtotal before tax and shipping; null when unknown.}
        includeInHomelabTotal: {type: boolean, default: true, description: Whether this selected item contributes to homelab-only spending. Inventory remains tracked either way.}
    PurchaseWrite:
      type: object
      additionalProperties: false
      required: [assetPublicIds, totalPriceCents, currency]
      properties:
        assetPublicIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/PublicId"}
        totalPriceCents: {type: integer, format: int64, minimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3, pattern: "^[A-Za-z]{3}$"}
        purchasedOn: {type: string, format: date, nullable: true}
        source: {type: string, nullable: true}
        orderReference: {type: string, nullable: true}
        notes: {type: string, nullable: true}
        lines:
          type: array
          description: Only the owned items selected from the source order.
          items: {$ref: "#/components/schemas/PurchaseLine"}
        links:
          type: array
          items: {$ref: "#/components/schemas/PurchaseLink"}
    Purchase:
      allOf:
        - {$ref: "#/components/schemas/PurchaseWrite"}
        - type: object
          required: [publicId]
          properties:
            publicId: {$ref: "#/components/schemas/PublicId"}
            trackedSubtotalCents:
              type: integer
              format: int64
              nullable: true
              description: Sum of selected line subtotals when all are known; excludes omitted items, tax, and shipping.
            homelabSubtotalCents:
              type: integer
              format: int64
              nullable: true
              description: Sum of selected lines included in homelab spending; excludes shared-home lines, omitted items, tax, and shipping.
    PurchaseTotal:
      type: object
      additionalProperties: false
      required: [currency, totalPriceCents, purchaseCount, assetCount]
      properties:
        currency: {type: string, minLength: 3, maxLength: 3}
        totalPriceCents: {type: integer, format: int64, minimum: 0}
        purchaseCount: {type: integer, format: int64, minimum: 1}
        assetCount: {type: integer, format: int64, minimum: 1}
    PurchaseSummary:
      type: object
      additionalProperties: false
      required: [totals]
      properties:
        totals:
          type: array
          description: Totals are separate per currency and count each Purchase once, regardless of bundled Asset count.
          items: {$ref: "#/components/schemas/PurchaseTotal"}
    AssetWrite:
      type: object
      additionalProperties: false
      required: [productPublicId, placement]
      properties:
        productPublicId: {$ref: "#/components/schemas/PublicId"}
        placement: {$ref: "#/components/schemas/AssetPlacement"}
        name: {type: string, nullable: true}
        serialNumber: {type: string, nullable: true}
        systemUuid: {type: string, nullable: true}
        notes: {type: string, nullable: true}
        links:
          type: array
          items: {$ref: "#/components/schemas/AssetLink"}
    Asset:
      allOf:
        - {$ref: "#/components/schemas/AssetWrite"}
        - type: object
          required: [publicId]
          properties:
            publicId: {$ref: "#/components/schemas/PublicId"}
            effectiveAreaPublicId:
              nullable: true
              allOf: [{$ref: "#/components/schemas/PublicId"}]
            purchasePublicId:
              nullable: true
              allOf: [{$ref: "#/components/schemas/PublicId"}]
    MachineWrite:
      type: object
      additionalProperties: false
      required: [machineProviderPublicId, areaPublicId, name, kind]
      properties:
        machineProviderPublicId: {$ref: "#/components/schemas/PublicId"}
        areaPublicId: {$ref: "#/components/schemas/PublicId"}
        assetPublicId:
          nullable: true
          allOf: [{$ref: "#/components/schemas/PublicId"}]
        parentMachinePublicId:
          nullable: true
          allOf: [{$ref: "#/components/schemas/PublicId"}]
        name: {type: string}
        slug: {$ref: "#/components/schemas/Slug"}
        kind: {$ref: "#/components/schemas/MachineKind"}
        isFavorite: {type: boolean, default: false}
        virtualizationPlatform: {type: string, nullable: true}
        hostname: {type: string, nullable: true}
        osMachineId: {type: string, nullable: true}
        operatingSystem: {type: string, nullable: true}
        operatingSystemVersion: {type: string, nullable: true}
        kernel: {type: string, nullable: true}
        architecture: {type: string, nullable: true}
        cpuCount: {type: integer, minimum: 1, nullable: true}
        cpuThreadCount: {type: integer, minimum: 1, nullable: true, description: Logical hardware threads for a physical Machine; cpuCount is cores on physical Machines or vCPUs on virtual Machines.}
        cpuAllocation:
          nullable: true
          allOf: [{$ref: "#/components/schemas/CpuAllocation"}]
        cpuVendor: {type: string, nullable: true}
        memoryBytes: {type: integer, format: int64, minimum: 1, nullable: true}
        storageBytes: {type: integer, format: int64, minimum: 1, nullable: true}
        storageMediaKind:
          nullable: true
          allOf: [{$ref: "#/components/schemas/StorageMediaKind"}]
        storageInterfaceKind:
          nullable: true
          allOf: [{$ref: "#/components/schemas/StorageInterfaceKind"}]
        estimatedMonthlyCostCents: {type: integer, format: int64, minimum: 0, nullable: true}
        costCurrency: {type: string, minLength: 3, maxLength: 3, nullable: true}
        notes: {type: string, nullable: true}
    Machine:
      allOf: [{$ref: "#/components/schemas/MachineWrite"}, {type: object, required: [publicId, slug, isFavorite], properties: {publicId: {$ref: "#/components/schemas/PublicId"}, slug: {$ref: "#/components/schemas/Slug"}, isFavorite: {type: boolean}}}]
    MachineUsername: {type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9._][A-Za-z0-9._-]{0,63}$"}
    MachineUserWrite:
      type: object
      additionalProperties: false
      required: [machinePublicId, username]
      properties:
        machinePublicId: {$ref: "#/components/schemas/PublicId"}
        username: {$ref: "#/components/schemas/MachineUsername"}
        isPreferred: {type: boolean, default: false}
        notes: {type: string, nullable: true}
    MachineUser:
      allOf:
        - {$ref: "#/components/schemas/MachineUserWrite"}
        - type: object
          required: [publicId, isPreferred]
          properties:
            publicId: {$ref: "#/components/schemas/PublicId"}
            isPreferred: {type: boolean}
    NetworkWrite:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties: {areaPublicId: {type: string, nullable: true}, name: {type: string}, slug: {$ref: "#/components/schemas/Slug"}, kind: {$ref: "#/components/schemas/NetworkKind"}, cidr: {type: string, nullable: true}, notes: {type: string, nullable: true}}
    Network:
      allOf: [{$ref: "#/components/schemas/NetworkWrite"}, {type: object, required: [publicId, slug], properties: {publicId: {type: string}, slug: {$ref: "#/components/schemas/Slug"}}}]
    AddressWrite:
      type: object
      additionalProperties: false
      required: [networkPublicId, address]
      description: Exactly one of machinePublicId, areaPublicId, or assetPublicId is required.
      properties:
        networkPublicId: {$ref: "#/components/schemas/PublicId"}
        machinePublicId: {type: string, nullable: true}
        areaPublicId: {type: string, nullable: true}
        assetPublicId: {type: string, nullable: true}
        name: {type: string, nullable: true}
        address: {type: string}
        dnsName: {type: string, nullable: true}
        interfaceName: {type: string, nullable: true}
        isPrimary: {type: boolean, default: false}
    Address:
      allOf: [{$ref: "#/components/schemas/AddressWrite"}, {type: object, required: [publicId, isPrimary], properties: {publicId: {type: string}, isPrimary: {type: boolean}}}]
    DNSZoneWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, description: Owned DNS zone, such as example.com.}
        registrar: {type: string, nullable: true}
        notes: {type: string, nullable: true}
    DNSZone:
      allOf: [{$ref: "#/components/schemas/DNSZoneWrite"}, {type: object, required: [publicId], properties: {publicId: {$ref: "#/components/schemas/PublicId"}}}]
    DNSRecordWrite:
      type: object
      additionalProperties: false
      required: [zonePublicId, name, kind, addressPublicId]
      properties:
        zonePublicId: {$ref: "#/components/schemas/PublicId"}
        name: {type: string, description: "@ for the zone apex or a relative hostname."}
        kind: {$ref: "#/components/schemas/DNSRecordKind"}
        addressPublicId: {$ref: "#/components/schemas/PublicId"}
    DNSRecord:
      allOf: [{$ref: "#/components/schemas/DNSRecordWrite"}, {type: object, required: [publicId, fqdn, address], properties: {publicId: {$ref: "#/components/schemas/PublicId"}, fqdn: {type: string}, address: {type: string}}}]
    IngressRouteWrite:
      type: object
      additionalProperties: false
      required: [endpointPublicId, ingressInstancePublicId, kind, target]
      properties:
        endpointPublicId: {$ref: "#/components/schemas/PublicId"}
        ingressInstancePublicId: {$ref: "#/components/schemas/PublicId"}
        kind: {$ref: "#/components/schemas/IngressRouteKind"}
        target: {type: string, description: Proxy upstream, static document root, or redirect destination.}
    IngressRoute:
      allOf: [{$ref: "#/components/schemas/IngressRouteWrite"}, {type: object, required: [ingressServiceName], properties: {ingressServiceName: {type: string}}}]
    ServiceWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, description: Human-readable branded name such as OpenCode or cAdvisor.}
        slug: {$ref: "#/components/schemas/Slug"}
        description: {type: string, nullable: true}
    Service:
      allOf: [{$ref: "#/components/schemas/ServiceWrite"}, {type: object, required: [publicId, slug, hasLogo], properties: {publicId: {type: string}, slug: {$ref: "#/components/schemas/Slug"}, hasLogo: {type: boolean}}}]
    InstanceWrite:
      type: object
      additionalProperties: false
      description: Machine instances require machinePublicId and may have a backend port; managed instances require managedProvider instead. Neither requires an endpoint URL.
      required: [servicePublicId, name]
      properties:
        servicePublicId: {$ref: "#/components/schemas/PublicId"}
        hostingKind: {$ref: "#/components/schemas/InstanceHostingKind"}
        machinePublicId: {type: string, nullable: true}
        managedProvider: {type: string, nullable: true}
        name: {type: string}
        slug: {$ref: "#/components/schemas/Slug"}
        port: {type: integer, minimum: 1, maximum: 65535, nullable: true}
        notes: {type: string, nullable: true}
    Instance:
      allOf: [{$ref: "#/components/schemas/InstanceWrite"}, {type: object, required: [publicId, slug], properties: {publicId: {type: string}, slug: {$ref: "#/components/schemas/Slug"}}}]
    InstanceEndpointWrite:
      type: object
      additionalProperties: false
      description: Machine endpoints require an address, scheme, and port. Managed endpoints require a verified HTTPS directUrl, including any path or query.
      required: [instancePublicId, name]
      properties:
        instancePublicId: {$ref: "#/components/schemas/PublicId"}
        addressPublicId: {type: string, nullable: true}
        directUrl: {type: string, format: uri, pattern: "^https://", nullable: true}
        dnsRecordPublicId: {$ref: "#/components/schemas/PublicId", nullable: true}
        name: {type: string}
        scheme: {$ref: "#/components/schemas/Scheme", nullable: true}
        port: {type: integer, minimum: 1, maximum: 65535, nullable: true}
        basePath: {type: string, default: ""}
        hostType: {$ref: "#/components/schemas/EndpointHostType"}
        isPreferred: {type: boolean, default: false}
        notes: {type: string, nullable: true}
    InstanceEndpoint:
      allOf: [{$ref: "#/components/schemas/InstanceEndpointWrite"}, {type: object, required: [publicId, basePath, isPreferred], properties: {publicId: {type: string}, basePath: {type: string}, isPreferred: {type: boolean}}}]
    MachineInstance:
      type: object
      required: [publicId, name, slug, servicePublicId, serviceName, serviceSlug]
      properties: {publicId: {type: string}, name: {type: string}, slug: {$ref: "#/components/schemas/Slug"}, port: {type: integer, minimum: 1, maximum: 65535, nullable: true}, servicePublicId: {type: string}, serviceName: {type: string}, serviceSlug: {$ref: "#/components/schemas/Slug"}}
    ResolvedDestination:
      type: object
      required: [url, via]
      properties: {url: {type: string, format: uri}, via: {$ref: "#/components/schemas/Via"}}
    Error:
      type: object
      required: [code, message]
      properties: {code: {type: string}, message: {type: string}}
