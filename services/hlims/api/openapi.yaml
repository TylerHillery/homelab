    post:
      tags: [Purchases]
      operationId: createPurchase
      requestBody: {$ref: "#/components/requestBodies/PurchaseWrite"}
      responses: {"201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Purchase"}}}}, default: {$ref: "#/components/responses/Error"}}
  /purchases/{publicId}:
