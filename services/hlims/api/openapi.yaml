      operationId: listDNSZones
      responses: {"200": {description: Owned DNS zones, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/DNSZone"}}}}}}}, default: {$ref: "#/components/responses/Error"}}
    post:
      tags: [DNS]
      operationId: createDNSZone
      requestBody: {$ref: "#/components/requestBodies/DNSZoneWrite"}
      responses: {"201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/DNSZone"}}}}, default: {$ref: "#/components/responses/Error"}}
  /dns-records:
