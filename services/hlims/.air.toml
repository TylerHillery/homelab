root = "."
tmp_dir = ".air"

[build]
cmd = "go build -o ./.air/hlims ./cmd/hlims"
entrypoint = ["./.air/hlims", "-dev-listen", "127.0.0.1:8080"]
include_ext = ["go", "html", "css", "js"]
exclude_dir = [".air", ".git"]
exclude_regex = ["_test\\.go"]
delay = 100
stop_on_error = true
send_interrupt = true
kill_delay = 500000000

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true

[proxy]
enabled = true
proxy_port = 8090
app_port = 8080
app_start_timeout = 5000
