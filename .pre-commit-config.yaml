repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^services/hlims/static/vendor/.*\.min\.js$
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: hlims-format
        name: "hlims: format"
        entry: mise //services/hlims:format-check
        language: system
        files: ^services/hlims/.*\.go$
        pass_filenames: false

      - id: hlims-generate
        name: "hlims: generate"
        entry: mise //services/hlims:generate-check
        language: system
        files: ^services/hlims/(api/|db/|generated/|sqlc\.yaml$)
        pass_filenames: false

      - id: hlims-lint
        name: "hlims: lint"
        entry: mise //services/hlims:lint
        language: system
        files: ^services/hlims/.*\.go$
        pass_filenames: false

      - id: hlims-test
        name: "hlims: test"
        entry: mise //services/hlims:test
        language: system
        files: ^services/hlims/
        pass_filenames: false

      - id: sql-lint
        name: "sql: lint"
        entry: mise //services/hlims:sql:lint
        language: system
        files: ^services/hlims/db/.*\.sql$
        pass_filenames: false
