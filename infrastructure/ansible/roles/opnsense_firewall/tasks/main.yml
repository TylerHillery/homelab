---
- name: Require private site values and runtime API credentials
  ansible.builtin.assert:
    that:
      - opnsense_firewall_api_host is defined
      - opnsense_firewall_tailnet_hostname is defined
      - opnsense_firewall_lan_address is defined
      - opnsense_firewall_lab_lan_subnet is defined
      - opnsense_firewall_lab_dhcp_range is defined
      - lookup('env', 'OPNSENSE_API_KEY') | length > 0
      - lookup('env', 'OPNSENSE_API_SECRET') | length > 0
    fail_msg: Configure the ignored site inventory and unlock the OPNsense API credentials.
  no_log: true
  tags: [always]

- name: Read Tailscale Serve configuration
  ansible.builtin.command:
    argv:
      - tailscale
      - ssh
      - "root@{{ opnsense_firewall_tailnet_hostname }}"
      - tailscale
      - serve
      - status
      - --json
  register: opnsense_firewall_tailscale_serve_status
  changed_when: false
  check_mode: false
  tags: [tailscale]

- name: Configure trusted HTTPS with Tailscale Serve
  ansible.builtin.command:
    argv:
      - tailscale
      - ssh
      - "root@{{ opnsense_firewall_tailnet_hostname }}"
      - tailscale
      - serve
      - --bg
      - --yes
      - --https=443
      - "{{ opnsense_firewall_serve_backend }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      (opnsense_firewall_tailscale_serve_status.stdout | from_json).get('Web', {})
      .get(opnsense_firewall_tailnet_hostname ~ ':443', {})
      .get('Handlers', {}).get('/', {}).get('Proxy', '')
      != opnsense_firewall_serve_backend
  tags: [tailscale]

- name: Verify Tailscale Serve configuration
  ansible.builtin.command:
    argv:
      - tailscale
      - ssh
      - "root@{{ opnsense_firewall_tailnet_hostname }}"
      - tailscale
      - serve
      - status
      - --json
  register: opnsense_firewall_tailscale_serve_verification
  changed_when: false
  when: not ansible_check_mode
  tags: [tailscale]

- name: Verify trusted HTTPS proxy settings
  ansible.builtin.assert:
    that:
      - >-
        (opnsense_firewall_tailscale_serve_verification.stdout | from_json)
        .get('TCP', {}).get('443', {}).get('HTTPS', false)
      - >-
        (opnsense_firewall_tailscale_serve_verification.stdout | from_json).get('Web', {})
        .get(opnsense_firewall_tailnet_hostname ~ ':443', {})
        .get('Handlers', {}).get('/', {}).get('Proxy', '')
        == opnsense_firewall_serve_backend
    fail_msg: Tailscale Serve is not proxying trusted HTTPS to OPNsense
  when: not ansible_check_mode
  tags: [tailscale]

- name: Read OPNsense web GUI alternate hostnames
  ansible.builtin.command:
    argv:
      - tailscale
      - ssh
      - "root@{{ opnsense_firewall_tailnet_hostname }}"
      - php
    stdin: |
      <?php
      require_once("util.inc");
      require_once("config.inc");
      global $config;
      echo $config["system"]["webgui"]["althostnames"] ?? "";
  register: opnsense_firewall_webgui_alternate_hostnames
  changed_when: false
  check_mode: false
  tags: [tailscale, webgui]

- name: Allow the Tailscale hostname in OPNsense web GUI checks
  ansible.builtin.command:
    argv:
      - tailscale
      - ssh
      - "root@{{ opnsense_firewall_tailnet_hostname }}"
      - php
    stdin: |
      <?php
      require_once("util.inc");
      require_once("config.inc");
      global $config;
      $hostname = "{{ opnsense_firewall_tailnet_hostname }}";
      $current = $config["system"]["webgui"]["althostnames"] ?? "";
      $hostnames = preg_split('/\s+/', trim($current), -1, PREG_SPLIT_NO_EMPTY);
      $hostnames[] = $hostname;
      $config["system"]["webgui"]["althostnames"] = implode(" ", array_unique($hostnames));
      write_config("Allow the Tailscale HTTPS hostname for web GUI access");
  when:
    - not ansible_check_mode
    - >-
      opnsense_firewall_tailnet_hostname
      not in opnsense_firewall_webgui_alternate_hostnames.stdout.split()
  changed_when: true
  tags: [tailscale, webgui]

- name: Verify the OPNsense web GUI alternate hostname
  ansible.builtin.command:
    argv:
      - tailscale
      - ssh
      - "root@{{ opnsense_firewall_tailnet_hostname }}"
      - php
    stdin: |
      <?php
      require_once("util.inc");
      require_once("config.inc");
      global $config;
      echo $config["system"]["webgui"]["althostnames"] ?? "";
  register: opnsense_firewall_webgui_alternate_hostnames_after
  changed_when: false
  when: not ansible_check_mode
  tags: [tailscale, webgui]

- name: Verify the Tailscale hostname is allowed by OPNsense
  ansible.builtin.assert:
    that:
      - >-
        opnsense_firewall_tailnet_hostname
        in opnsense_firewall_webgui_alternate_hostnames_after.stdout.split()
    fail_msg: OPNsense did not retain the Tailscale web GUI hostname
  when: not ansible_check_mode
  tags: [tailscale, webgui]


- name: Install the OPNsense Tailscale community plugin
  oxlorg.opnsense.package:
    firewall: "{{ opnsense_firewall_api_host }}"
    api_port: "{{ opnsense_firewall_api_port }}"
    api_key: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    api_secret: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    ssl_verify: "{{ opnsense_firewall_ssl_verify }}"
    name: [os-tailscale]
    action: install
  tags: [packages, tailscale]
  no_log: true

- name: Read current Tailscale service settings
  ansible.builtin.uri:
    url: "{{ opnsense_firewall_api_url }}/api/tailscale/settings/get"
    method: GET
    user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_firewall_ssl_verify }}"
  register: opnsense_firewall_tailscale_settings_before
  check_mode: false
  tags: [tailscale]
  no_log: true

- name: Configure Tailscale service settings
  ansible.builtin.uri:
    url: "{{ opnsense_firewall_api_url }}/api/tailscale/settings/set"
    method: POST
    user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_firewall_ssl_verify }}"
    body_format: json
    body:
      settings: "{{ opnsense_firewall_tailscale_settings }}"
  register: opnsense_firewall_tailscale_settings_update
  changed_when: true
  when: >-
    opnsense_firewall_tailscale_settings_before.json.settings.enabled
    != opnsense_firewall_tailscale_settings.enabled or
    opnsense_firewall_tailscale_settings_before.json.settings.loginTimeout
    != opnsense_firewall_tailscale_settings.loginTimeout or
    opnsense_firewall_tailscale_settings_before.json.settings.listenPort
    != opnsense_firewall_tailscale_settings.listenPort or
    opnsense_firewall_tailscale_settings_before.json.settings.acceptDNS
    != opnsense_firewall_tailscale_settings.acceptDNS or
    opnsense_firewall_tailscale_settings_before.json.settings.advertiseExitNode
    != opnsense_firewall_tailscale_settings.advertiseExitNode or
    opnsense_firewall_tailscale_settings_before.json.settings.acceptSubnetRoutes
    != opnsense_firewall_tailscale_settings.acceptSubnetRoutes or
    opnsense_firewall_tailscale_settings_before.json.settings.enableSSH
    != opnsense_firewall_tailscale_settings.enableSSH or
    opnsense_firewall_tailscale_settings_before.json.settings.disableSNAT
    != opnsense_firewall_tailscale_settings.disableSNAT
  tags: [tailscale]

# Must run before the subsequent availability and settings checks.
  no_log: true

- name: Apply Tailscale service settings  # noqa: no-handler
  ansible.builtin.uri:
    url: "{{ opnsense_firewall_api_url }}/api/tailscale/service/reconfigure"
    method: POST
    user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_firewall_ssl_verify }}"
    timeout: 10
    body_format: json
    body: {}
  when: opnsense_firewall_tailscale_settings_update is changed
  failed_when: false
  tags: [tailscale]

# The reconfigured API must recover before any more firewall tasks run.
  no_log: true

- name: Wait for Tailscale HTTPS after reconfiguration  # noqa: no-handler
  ansible.builtin.uri:
    url: "{{ opnsense_firewall_api_url }}/api/tailscale/service/status"
    method: GET
    user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_firewall_ssl_verify }}"
    timeout: 5
  register: opnsense_firewall_tailscale_https_status
  until: opnsense_firewall_tailscale_https_status.json.status | default('') == "running"
  retries: 12
  delay: 5
  when: opnsense_firewall_tailscale_settings_update is changed
  tags: [tailscale]
  no_log: true

- name: Read configured Tailscale service settings
  ansible.builtin.uri:
    url: "{{ opnsense_firewall_api_url }}/api/tailscale/settings/get"
    method: GET
    user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_firewall_ssl_verify }}"
  register: opnsense_firewall_tailscale_settings_after
  check_mode: false
  tags: [tailscale]
  no_log: true

- name: Verify Tailscale SSH and exit-node settings
  ansible.builtin.assert:
    that:
      - opnsense_firewall_tailscale_settings_after.json.settings.enableSSH == "1"
      - opnsense_firewall_tailscale_settings_after.json.settings.advertiseExitNode == "1"
    fail_msg: OPNsense did not retain the requested Tailscale settings
  when: not ansible_check_mode
  tags: [tailscale]

- name: Read Tailscale status
  ansible.builtin.uri:
    url: "{{ opnsense_firewall_api_url }}/api/tailscale/status/status"
    method: GET
    user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_firewall_ssl_verify }}"
  register: opnsense_firewall_tailscale_status
  check_mode: false
  tags: [tailscale]
  no_log: true

- name: Enroll OPNsense in Tailscale
  when:
    - not ansible_check_mode
    - opnsense_firewall_tailscale_status.json.BackendState != "Running"
  tags: [tailscale]
  block:
    - name: Save the one-time Tailscale enrollment key
      ansible.builtin.uri:
        url: "{{ opnsense_firewall_api_url }}/api/tailscale/authentication/set"
        method: POST
        user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
        password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
        force_basic_auth: true
        validate_certs: "{{ opnsense_firewall_ssl_verify }}"
        body_format: json
        body:
          authentication:
            loginServer: "https://controlplane.tailscale.com"
            preAuthKey: "{{ lookup('env', 'TAILSCALE_AUTH_KEY') }}"
      no_log: true

    - name: Apply Tailscale enrollment
      ansible.builtin.uri:
        url: "{{ opnsense_firewall_api_url }}/api/tailscale/service/reconfigure"
        method: POST
        user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
        password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
        force_basic_auth: true
        validate_certs: "{{ opnsense_firewall_ssl_verify }}"
        body_format: json
        body: {}
      no_log: true

    - name: Wait for Tailscale enrollment
      ansible.builtin.uri:
        url: "{{ opnsense_firewall_api_url }}/api/tailscale/status/status"
        method: GET
        user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
        password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
        force_basic_auth: true
        validate_certs: "{{ opnsense_firewall_ssl_verify }}"
      register: opnsense_firewall_tailscale_enrollment_status
      until: opnsense_firewall_tailscale_enrollment_status.json.BackendState == "Running"
      retries: 6
      delay: 5

    - name: Remove the consumed Tailscale enrollment key
      ansible.builtin.uri:
        url: "{{ opnsense_firewall_api_url }}/api/tailscale/authentication/set"
        method: POST
        user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
        password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
        force_basic_auth: true
        validate_certs: "{{ opnsense_firewall_ssl_verify }}"
        body_format: json
        body:
          authentication:
            loginServer: "https://controlplane.tailscale.com"
            preAuthKey: ""
      no_log: true

    - name: Remove the enrollment key from generated service configuration
      ansible.builtin.uri:
        url: "{{ opnsense_firewall_api_url }}/api/tailscale/service/reconfigure"
        method: POST
        user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
        password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
        force_basic_auth: true
        validate_certs: "{{ opnsense_firewall_ssl_verify }}"
        body_format: json
        body: {}
      no_log: true

- name: Manage RFC1918 network alias
  oxlorg.opnsense.alias:
    firewall: "{{ opnsense_firewall_api_host }}"
    api_port: "{{ opnsense_firewall_api_port }}"
    api_key: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    api_secret: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    ssl_verify: "{{ opnsense_firewall_ssl_verify }}"
    name: rfc1918
    type: network
    content: "{{ opnsense_firewall_lab_rfc1918_networks }}"
    description: "All private address space (lab isolation)"
    reload: true
    state: present
  tags: [firewall]
  no_log: true

- name: Read the loaded RFC1918 PF table
  ansible.builtin.command:
    argv:
      - tailscale
      - ssh
      - "root@{{ opnsense_firewall_tailnet_hostname }}"
      - pfctl
      - -t
      - rfc1918
      - -T
      - show
  register: opnsense_firewall_rfc1918_pf_table
  changed_when: false
  check_mode: false
  tags: [firewall]

- name: Verify the RFC1918 PF table
  ansible.builtin.assert:
    that:
      - item.split('/')[0] in opnsense_firewall_rfc1918_pf_table.stdout
    fail_msg: "The RFC1918 PF table is missing {{ item }}"
  loop: "{{ opnsense_firewall_lab_rfc1918_networks }}"
  when: not ansible_check_mode
  tags: [firewall]

- name: Allow tailnet HTTPS management of this firewall
  oxlorg.opnsense.rule:
    firewall: "{{ opnsense_firewall_api_host }}"
    api_port: "{{ opnsense_firewall_api_port }}"
    api_key: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    api_secret: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    ssl_verify: "{{ opnsense_firewall_ssl_verify }}"
    description: "Tailnet management: HTTPS to this firewall"
    interface: []
    direction: in
    protocol: TCP
    source_net: "{{ opnsense_firewall_tailnet_ipv4_subnet }}"
    destination_net: "(self)"
    destination_port: 443
    action: pass
    sequence: 1
    match_fields: [description]
    reload: true
    state: present
  tags: [firewall, tailscale]

# Floating rules run before interface rules, including OPNsense's default LAN allow.
  no_log: true

- name: Allow lab LAN to reach this firewall (DNS)
  oxlorg.opnsense.rule:
    firewall: "{{ opnsense_firewall_api_host }}"
    api_port: "{{ opnsense_firewall_api_port }}"
    api_key: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    api_secret: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    ssl_verify: "{{ opnsense_firewall_ssl_verify }}"
    description: "Lab services: DNS to this firewall"
    interface: []
    direction: in
    protocol: TCP/UDP
    source_net: "{{ opnsense_firewall_lab_lan_subnet }}"
    destination_net: lanip
    destination_port: 53
    action: pass
    sequence: 1
    match_fields: [description]
    reload: true
    state: present
  tags: [firewall]
  no_log: true

- name: Allow lab LAN to reach this firewall (GUI/API)
  oxlorg.opnsense.rule:
    firewall: "{{ opnsense_firewall_api_host }}"
    api_port: "{{ opnsense_firewall_api_port }}"
    api_key: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    api_secret: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    ssl_verify: "{{ opnsense_firewall_ssl_verify }}"
    description: "Lab services: GUI/API to this firewall"
    interface: []
    direction: in
    protocol: TCP
    source_net: "{{ opnsense_firewall_lab_lan_subnet }}"
    destination_net: lanip
    destination_port: 443
    action: pass
    sequence: 2
    match_fields: [description]
    reload: true
    state: present
  tags: [firewall]
  no_log: true

- name: Block lab LAN access to household and other RFC1918 networks
  oxlorg.opnsense.rule:
    firewall: "{{ opnsense_firewall_api_host }}"
    api_port: "{{ opnsense_firewall_api_port }}"
    api_key: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    api_secret: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    ssl_verify: "{{ opnsense_firewall_ssl_verify }}"
    description: "Lab isolation: no RFC1918 from LAN"
    interface: []
    direction: in
    protocol: any
    source_net: "{{ opnsense_firewall_lab_lan_subnet }}"
    destination_net: rfc1918
    action: block
    sequence: 3
    match_fields: [description]
    reload: true
    state: present
  tags: [firewall]
  no_log: true

- name: Configure DHCP for the lab LAN
  oxlorg.opnsense.dhcp_subnet:
    firewall: "{{ opnsense_firewall_api_host }}"
    api_port: "{{ opnsense_firewall_api_port }}"
    api_key: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    api_secret: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    ssl_verify: "{{ opnsense_firewall_ssl_verify }}"
    subnet: "{{ opnsense_firewall_lab_lan_subnet }}"
    pools:
      - "{{ opnsense_firewall_lab_dhcp_range[0] }} - {{ opnsense_firewall_lab_dhcp_range[1] }}"
    gateway: ["{{ opnsense_firewall_lan_address }}"]
    dns: ["{{ opnsense_firewall_lan_address }}"]
    reload: true
    state: present
  tags: [dhcp]
  no_log: true

- name: Ensure Unbound DNS is enabled
  oxlorg.opnsense.unbound_general:
    firewall: "{{ opnsense_firewall_api_host }}"
    api_port: "{{ opnsense_firewall_api_port }}"
    api_key: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    api_secret: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    ssl_verify: "{{ opnsense_firewall_ssl_verify }}"
    enabled: true
    # The module requires a valid prefix even while DNS64 is disabled.
    dns64_prefix: "64:ff9b::/96"
    reload: true
  tags: [dns]
  no_log: true

- name: Read Unbound private domains
  ansible.builtin.uri:
    url: "{{ opnsense_firewall_api_url }}/api/unbound/settings/get"
    method: GET
    user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_firewall_ssl_verify }}"
  register: opnsense_firewall_unbound_settings_before
  check_mode: false
  no_log: true
  tags: [dns]

- name: Collect existing Unbound private domains
  ansible.builtin.set_fact:
    opnsense_firewall_unbound_existing_private_domains: >-
      {{ opnsense_firewall_unbound_settings_before.json.unbound.advanced.privatedomain
         | dict2items | map(attribute='value')
         | selectattr('selected', 'equalto', 1)
         | map(attribute='value') | reject('equalto', '') | list }}
  tags: [dns]

- name: Preserve existing Unbound private domains
  ansible.builtin.set_fact:
    opnsense_firewall_merged_private_domains: >-
      {{ opnsense_firewall_unbound_existing_private_domains
         | union(opnsense_firewall_unbound_private_domains) }}
  tags: [dns]

- name: Preview Unbound private domain additions
  ansible.builtin.debug:
    msg: >-
      Add Unbound private domains:
      {{ opnsense_firewall_unbound_private_domains
         | difference(opnsense_firewall_unbound_existing_private_domains) }}
  changed_when: >-
    opnsense_firewall_unbound_private_domains
    | difference(opnsense_firewall_unbound_existing_private_domains) | length > 0
  tags: [dns]

- name: Allow tailnet DNS answers for homelab private domains
  ansible.builtin.uri:
    url: "{{ opnsense_firewall_api_url }}/api/unbound/settings/set"
    method: POST
    user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_firewall_ssl_verify }}"
    body_format: json
    body:
      unbound:
        advanced:
          privatedomain: "{{ opnsense_firewall_merged_private_domains | join(',') }}"
  register: opnsense_firewall_unbound_private_domains_update
  changed_when: true
  no_log: true
  when:
    - not ansible_check_mode
    - >-
      opnsense_firewall_unbound_private_domains
      | difference(opnsense_firewall_unbound_existing_private_domains) | length > 0
  tags: [dns]

# Reconfigure immediately so the following read verifies the live setting.
- name: Apply Unbound private domain settings  # noqa: no-handler
  ansible.builtin.uri:
    url: "{{ opnsense_firewall_api_url }}/api/unbound/service/reconfigure"
    method: POST
    user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_firewall_ssl_verify }}"
    body_format: json
    body: {}
  no_log: true
  when: opnsense_firewall_unbound_private_domains_update is changed
  tags: [dns]

- name: Verify Unbound private domains
  ansible.builtin.uri:
    url: "{{ opnsense_firewall_api_url }}/api/unbound/settings/get"
    method: GET
    user: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
    password: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
    force_basic_auth: true
    validate_certs: "{{ opnsense_firewall_ssl_verify }}"
  register: opnsense_firewall_unbound_settings_after
  check_mode: false
  no_log: true
  when: not ansible_check_mode
  tags: [dns]

- name: Assert Unbound permits private homelab answers
  ansible.builtin.assert:
    that:
      - >-
        opnsense_firewall_unbound_private_domains | difference(
          opnsense_firewall_unbound_settings_after.json.unbound.advanced.privatedomain
          | dict2items | map(attribute='value')
          | selectattr('selected', 'equalto', 1)
          | map(attribute='value') | list) | length == 0
  when: not ansible_check_mode
  tags: [dns]
