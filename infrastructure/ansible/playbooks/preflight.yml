---
- name: Inspect Ubuntu development hosts without changing them
  hosts: ubuntu_dev
  gather_facts: true
  tasks:
    - name: Require Ubuntu on the managed host
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: The Ubuntu development composition supports Ubuntu only.

    - name: Require a non-root management account
      ansible.builtin.assert:
        that:
          - ansible_facts['user_id'] != 'root'
