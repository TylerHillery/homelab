[tasks.check]
description = "Check the host Caddyfile with the shared Caddy build without starting it"
dir = "{{ config_root }}"
run = '''
set -eu
caddy="../caddy/.build/caddy"
test -x "$caddy"
CF_API_TOKEN=placeholder "$caddy" adapt --config Caddyfile >/dev/null
"$caddy" fmt Caddyfile | cmp -s Caddyfile -
'''
